<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Calendar</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --hover-color: #475569;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        button.secondary:hover {
            background-color: var(--border-color);
        }

        /* Таблица календаря */
        .calendar-scroll {
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table.calendar {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
            font-size: 12px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 4px;
            min-width: 24px;
            height: 24px;
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 500;
        }

        td.day-cell {
            cursor: pointer;
            transition: transform 0.1s;
        }

        td.day-cell:hover {
            transform: scale(1.15);
            z-index: 10;
            position: relative;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        td.empty {
            background-color: rgba(0,0,0,0.1);
            cursor: default;
        }

        /* Легенда и счетчики */
        .legend-container {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .counter-badge {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* Мобильное окно авторизации */
        #auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-color);
        }

        .modal-content input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }

        .modal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-tab {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .modal-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1>⭐ Годовой календарь</h1>
                <span id="year-label" style="color: var(--text-muted); font-size: 18px;">2026</span>
            </div>
            <div class="auth-section" id="auth-container">
                <span id="user-email" style="font-size: 14px; color: var(--text-muted);"></span>
                <button id="login-btn" onclick="openAuthModal()">Войти</button>
                <button id="logout-btn" class="secondary" style="display:none;" onclick="handleLogout()">Выйти</button>
            </div>
        </header>

        <div class="calendar-scroll">
            <table class="calendar" id="calendar-table">
                <!-- Генерируется скриптом -->
            </table>
        </div>

        <div class="legend-container" id="legend-container">
            <!-- Легенда и счетчики генерируются скриптом -->
        </div>
    </div>

    <!-- Модальное окно входа / регистрации -->
    <div id="auth-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin:0;">Авторизация</h3>
            <div class="modal-tabs">
                <button class="modal-tab active" id="tab-signin" onclick="switchAuthTab('signin')">Вход</button>
                <button class="modal-tab" id="tab-signup" onclick="switchAuthTab('signup')">Регистрация</button>
            </div>
            
            <button onclick="loginWithGoogle()" style="background: #db4437; margin-bottom: 10px;">Войти через Google</button>
            <div style="text-align: center; color: var(--text-muted); font-size: 12px;">или по Email</div>

            <input type="email" id="email-input" placeholder="Email">
            <input type="password" id="password-input" placeholder="Пароль">
            
            <button id="email-auth-btn" onclick="handleEmailAuth()">Войти</button>
            <button class="secondary" onclick="closeAuthModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gnczstcivximbigwtyrt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GXqipg1rfDcdZ9jRH8U_qg_WF-iLk5e';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const currentYear = 2026;
        let currentUser = null;
        let isSignUpMode = false;

        // Данные календаря (выбранные цвета для дней и тексты легенды)
        let calendarData = {}; 
        let legendData = {
            1: { color: '#ef4444', label: 'Важно' },
            2: { color: '#f59e0b', label: 'Прогресс' },
            3: { color: '#10b981', label: 'Отлично (Зеленые дни)' },
            4: { color: '#3b82f6', label: 'Планы' },
            5: { color: '#8b5cf6', label: 'Другое' }
        };
        let activeColor = 3; // По умолчанию выбран зеленый

        const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

        async function init() {
            renderCalendarSkeleton();
            renderLegend();

            // Проверка сессии
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                updateAuthUI();
                await loadCloudData();
            }

            _supabase.auth.onAuthStateChange(async (event, session) => {
                currentUser = session?.user || null;
                updateAuthUI();
                if (currentUser) {
                    await loadCloudData();
                }
            });
        }

        // Рендер сетки календаря
        function renderCalendarSkeleton() {
            const table = document.getElementById('calendar-table');
            let html = '<thead><tr><th>Месяц</th>';
            for (let d = 1; d <= 31; d++) html += `<th>${d}</th>`;
            html += '</tr></thead><tbody>';

            for (let m = 0; m < 12; m++) {
                html += `<tr><td>${months[m]}</td>`;
                const daysInMonth = new Date(currentYear, m + 1, 0).getDate();
                for (let d = 1; d <= 31; d++) {
                    if (d <= daysInMonth) {
                        const dateStr = `${currentYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        html += `<td class="day-cell" id="day-${dateStr}" onclick="handleDayClick('${dateStr}')" title="${dateStr}"></td>`;
                    } else {
                        html += `<td class="empty"></td>`;
                    }
                }
                html += '</tr>';
            }
            html += '</tbody>';
            table.innerHTML = html;
        }

        // Рендер легенды и счетчиков
        function renderLegend() {
            const container = document.getElementById('legend-container');
            let html = '';

            // Подсчет статистики по цветам
            const counts = {};
            Object.values(calendarData).forEach(colorId => {
                counts[colorId] = (counts[colorId] || 0) + 1;
            });

            for (const [id, item] of Object.entries(legendData)) {
                const isSelected = activeColor == id;
                const count = counts[id] || 0;
                html += `
                    <div class="legend-item" style="border: ${isSelected ? '2px solid white' : '1px solid transparent'}; padding: 4px 8px; border-radius: 8px;" onclick="setActiveColor(${id})">
                        <div class="color-box" style="background-color: ${item.color};"></div>
                        <span>${item.label}</span>
                        <span class="counter-badge">${count}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function setActiveColor(id) {
            activeColor = id;
            renderLegend();
        }

        function handleDayClick(dateStr) {
            if (calendarData[dateStr] === activeColor) {
                delete calendarData[dateStr]; // Снять выбор при повторном клике
            } else {
                calendarData[dateStr] = activeColor;
            }
            updateCalendarDisplay();
            renderLegend();
            saveDataDebounced();
        }

        function updateCalendarDisplay() {
            // Очистка всех ячеек
            for (let m = 0; m < 12; m++) {
                const daysInMonth = new Date(currentYear, m + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${currentYear}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const cell = document.getElementById(`day-${dateStr}`);
                    if (cell) {
                        const colorId = calendarData[dateStr];
                        cell.style.backgroundColor = colorId ? legendData[colorId].color : 'transparent';
                    }
                }
            }
        }

        // Синхронизация с Supabase
        let saveTimeout = null;
        function saveDataDebounced() {
            if (!currentUser) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                await _supabase.from('calendars').upsert({
                    user_id: currentUser.id,
                    year: currentYear,
                    data: calendarData
                }, { onConflict: 'user_id,year' });
            }, 500);
        }

        async function loadCloudData() {
            const { data, error } = await _supabase
                .from('calendars')
                .select('data')
                .eq('user_id', currentUser.id)
                .eq('year', currentYear)
                .single();

            if (data && data.data) {
                calendarData = data.data;
                updateCalendarDisplay();
                renderLegend();
            }
        }

        // Управление модалкой и авторизацией
        function openAuthModal() {
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        function switchAuthTab(mode) {
            isSignUpMode = (mode === 'signup');
            document.getElementById('tab-signin').classList.toggle('active', !isSignUpMode);
            document.getElementById('tab-signup').classList.toggle('active', isSignUpMode);
            document.getElementById('modal-title').innerText = isSignUpMode ? 'Регистрация' : 'Авторизация';
            document.getElementById('email-auth-btn').innerText = isSignUpMode ? 'Зарегистрироваться' : 'Войти';
        }

        async function loginWithGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href.split('?')[0]
                }
            });
            if (error) alert(error.message);
        }

        async function handleEmailAuth() {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                alert('Введите email и пароль');
                return;
            }

            if (isSignUpMode) {
                const { error } = await _supabase.auth.signUp({ email, password });
                if (error) alert(error.message);
                else {
                    alert('Регистрация успешна! Проверьте почту для подтверждения или попробуйте войти.');
                    closeAuthModal();
                }
            } else {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
                else closeAuthModal();
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            calendarData = {};
            updateCalendarDisplay();
            renderLegend();
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('user-email').innerText = currentUser.email;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
            } else {
                document.getElementById('user-email').innerText = '';
                document.getElementById('login-btn').style.display = 'inline-block';
                document.getElementById('logout-btn').style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
